<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090a"><title>Ma Cave</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#09090a;--p:#151517;--p2:#202023;--gold:#d0aa61;--txt:#f4f1ea;--mut:#9b9892;--line:#302e30;--red:#622331;--green:#2f7c5a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#302216,#09090a 45%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}.app{max-width:850px;margin:auto;padding:22px 16px calc(30px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.brand{font:32px Georgia,serif}.sub{color:var(--mut);font-size:12px;margin-top:3px}.add{background:var(--gold);border:0;border-radius:13px;padding:11px 14px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat,.card{background:linear-gradient(145deg,#19191b,#101011);border:1px solid var(--line);border-radius:17px}.stat{padding:14px}.num{font-size:23px;font-weight:700}.lab{font-size:10px;color:var(--mut);margin-top:3px}.search{width:100%;margin:14px 0 9px;padding:13px;border-radius:13px;border:1px solid var(--line);background:#111113;color:var(--txt);outline:0}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;background:#111113;border:1px solid var(--line);color:#bbb;border-radius:20px;padding:8px 12px}.chip.on{color:var(--gold);border-color:#806a3d}.title{font:16px Georgia,serif;color:var(--gold);margin:17px 2px 9px}.card{padding:14px;cursor:pointer}margin-bottom:9px}.top{display:flex;justify-content:space-between;gap:10px}.wine{font:18px Georgia,serif}.app{color:var(--mut);font-size:13px;margin-top:4px}.year{font-size:18px;color:var(--gold);font-weight:700}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}.tag{background:#232225;border-radius:8px;padding:6px 8px;font-size:11px;color:#c7c4be}.now{color:#8bd0ad;background:#12251c}.actions{display:flex;gap:7px}.act{flex:1;border:1px solid #39363a;background:var(--p2);color:#eee;border-radius:10px;padding:10px 6px}.loc{background:var(--red);border-color:#803243}.viv{color:var(--gold)}.del{flex:0 0 42px}.empty{text-align:center;color:var(--mut);padding:40px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:end;z-index:5}.modal.open{display:flex}.sheet{width:100%;background:#161618;border-radius:24px 24px 0 0;padding:20px 17px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{font:22px Georgia,serif;margin:0 0 8px}.detailSub{color:var(--mut);margin-bottom:18px}.detailGrid{display:grid;gap:10px}.detailGrid>div{background:#0d0d0f;border:1px solid var(--line);border-radius:12px;padding:12px}.detailGrid b,.detailGrid span{display:block}.detailGrid span{color:#ccc;margin-top:5px}.detailActions{display:flex;gap:7px;margin-top:15px}.detailActions .act{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:10px;color:var(--mut)}.field input,.field select{background:#0d0d0f;color:var(--txt);border:1px solid #38363a;border-radius:10px;padding:11px}.foot{display:flex;gap:8px;margin-top:15px}.foot button{flex:1;padding:12px;border-radius:11px;border:1px solid #39363a;background:#252427;color:white}.foot .save{background:var(--gold);color:#17120a;border:0;font-weight:700}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,130px);background:#f1eee8;color:#111;padding:11px 15px;border-radius:12px;transition:.2s;z-index:20}.toast.show{transform:translate(-50%,0)}@media(min-width:700px){.app{padding-top:35px}.modal{align-items:center}.sheet{max-width:650px;border-radius:24px}}
</style></head><body><main class="app"><header><div><div class="brand">Ma Cave</div><div class="sub">Votre cave, simplement.</div></div><button class="add" onclick="openModal()">＋ Ajouter</button></header><section class="stats"><div class="stat"><div id="count" class="num">0</div><div class="lab">BOUTEILLES</div></div><div class="stat"><div id="peak" class="num">0</div><div class="lab">À BOIRE</div></div></section><input id="search" class="search" placeholder="Rechercher un vin, une appellation, un millésime…" oninput="render()"><div id="chips" class="chips"></div><div class="title">Ma sélection</div><div id="list"></div></main>
<div id="detail" class="modal" onclick="if(event.target===this)closeDetail()"><div class="sheet" id="detailContent"></div></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle">Ajouter une bouteille</h2><div class="grid"><div class="field full"><label>VIN / DOMAINE</label><input id="wine" placeholder="Château Grand Pontet"></div><div class="field full"><label>APPELLATION</label><select id="app"></select></div><div class="field"><label>MILLÉSIME</label><input id="vintage" type="number" inputmode="numeric"></div><div class="field"><label>DÉBUT APOGÉE</label><input id="start" type="number" inputmode="numeric"></div><div class="field"><label>FIN APOGÉE</label><input id="end" type="number" inputmode="numeric"></div><div class="field"><label>ZONE</label><select id="zone"></select></div><div class="field"><label>RANGÉE</label><select id="row"></select></div><div class="field"><label>POSITION</label><select id="pos"></select></div></div><div class="foot"><button onclick="closeModal()">Annuler</button><button id="saveBtn" class="save" onclick="saveBottle()">Ajouter</button></div></div></div><div id="toast" class="toast"></div>
<script>
const K="ma-cave-v4",OLD="ma-cave-v3";
let bottles=JSON.parse(localStorage.getItem(K)||"null");
if(!bottles){bottles=JSON.parse(localStorage.getItem(OLD)||"null")||[{id:1,wine:"Château Grand Pontet",app:"Saint-Émilion Grand Cru",vintage:2019,start:2025,end:2035,zone:3,row:4,pos:2},{id:2,wine:"Château de Lascaux",app:"Pic Saint-Loup",vintage:2023,start:2026,end:2031,zone:1,row:2,pos:5}];localStorage.setItem(K,JSON.stringify(bottles))}
let filter="Toutes",editId=null;
const appellations=["Saint-Émilion Grand Cru","Saint-Émilion","Pomerol","Pauillac","Margaux","Saint-Julien","Saint-Estèphe","Pic Saint-Loup","Châteauneuf-du-Pape","Crozes-Hermitage","Saint-Joseph","Vacqueyras","Maranges","Bourgogne","Bordeaux Supérieur","Crémant de Bordeaux","Autre"];
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(bottles)),peak=b=>{let y=new Date().getFullYear();return y>=b.start&&y<=b.end};
function render(){let q=$( "search").value.toLowerCase(),zs=["Toutes",...new Set(bottles.map(b=>b.zone).sort((a,b)=>a-b))];$( "count").textContent=bottles.length;$( "peak").textContent=bottles.filter(peak).length;$( "chips").innerHTML=zs.map(z=>'<button class="chip '+(filter===z?"on":"")+'" onclick="setFilter('+JSON.stringify(z)+')">'+(z==="Toutes"?"Toutes":"Zone "+z)+'</button>').join("");let a=bottles.filter(b=>(filter==="Toutes"||b.zone===filter)&&(!q||(b.wine+" "+b.app+" "+b.vintage).toLowerCase().includes(q))).sort((x,y)=>x.zone-y.zone||x.row-y.row||x.pos-y.pos);$( "list").innerHTML=a.length?a.map(card).join(""):'<div class="empty">Aucune bouteille.</div>'}
function setFilter(z){filter=z;render()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function card(b){return '<article class="card" onclick="openDetail('+b.id+')"><div class="top"><div><div class="wine">'+esc(b.wine)+'</div><div class="app">'+esc(b.app)+'</div></div><div class="year">'+b.vintage+'</div></div><div class="tags"><span class="tag">Zone '+b.zone+' · Rangée '+b.row+' · Position '+b.pos+'</span><span class="tag '+(peak(b)?"now":"")+'">'+(peak(b)?"À boire maintenant":"Apogée "+b.start+"–"+b.end)+'</span></div><div class="actions"><button class="act loc" onclick="event.stopPropagation();locate('+b.id+')">⌖ Localiser</button><button class="act viv" onclick="event.stopPropagation();vivino('+b.id+')">V Vivino</button><button class="act del" onclick="event.stopPropagation();removeBottle('+b.id+')">×</button></div></article>'}
function fillSelects(){for(let [id,n] of [["zone",8],["row",10],["pos",6]])$(id).innerHTML=Array.from({length:n},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join("");$( "app").innerHTML=appellations.map(a=>'<option value="'+esc(a)+'">'+esc(a)+'</option>').join("")}
function openModal(id=null){editId=id;fillSelects();let b=id&&bottles.find(x=>x.id===id);$( "modalTitle").textContent=b?"Modifier la bouteille":"Ajouter une bouteille";$( "saveBtn").textContent=b?"Enregistrer":"Ajouter";["wine","vintage","start","end"].forEach(k=>$(k).value=b?(b[k]??""):"");$( "app").value=b?b.app:"";$( "zone").value=b?b.zone:1;$( "row").value=b?b.row:1;$( "pos").value=b?b.pos:1;$( "modal").classList.add("open")}
function closeModal(){$( "modal").classList.remove("open");editId=null}
function openDetail(id){let b=bottles.find(x=>x.id===id);if(!b)return;$( "detailContent").innerHTML='<h2>'+esc(b.wine)+'</h2><div class="detailSub">'+esc(b.app)+' · '+b.vintage+'</div><div class="detailGrid"><div><b>Apogée</b><span>'+b.start+'–'+b.end+'</span></div><div><b>Emplacement</b><span>Zone '+b.zone+' · Rangée '+b.row+' · Position '+b.pos+'</span></div></div><div class="detailActions"><button class="act loc" onclick="locate('+b.id+')">⌖ Localiser</button><button class="act viv" onclick="vivino('+b.id+')">V Vivino</button><button class="act" onclick="closeDetail();openModal('+b.id+')">Modifier</button></div>';$( "detail").classList.add("open")}
function closeDetail(){$( "detail").classList.remove("open")}
function saveBottle(){let w=$( "wine").value.trim(),a=$( "app").value,v=+$( "vintage").value;if(!w||!a||!v){toast("Complète le vin, l'appellation et le millésime.");return}let data={id:editId||Date.now(),wine:w,app:a,vintage:v,start:+$( "start").value||v,end:+$( "end").value||v+8,zone:+$( "zone").value,row:+$( "row").value,pos:+$( "pos").value};if(editId)bottles=bottles.map(b=>b.id===editId?data:b);else bottles.push(data);save();closeModal();closeDetail();render();toast(editId?"Fiche modifiée":"Bouteille ajoutée")}
function removeBottle(id){let b=bottles.find(x=>x.id===id);if(confirm("Supprimer "+b.wine+" "+b.vintage+" ?")){bottles=bottles.filter(x=>x.id!==id);save();closeDetail();render();toast("Bouteille supprimée")}}
function locate(id){let b=bottles.find(x=>x.id===id);toast("Zone "+b.zone+" · Rangée "+b.row+" · Position "+b.pos)}
function vivino(id){let b=bottles.find(x=>x.id===id);let q="VIVINO "+b.wine+" "+b.app+" "+b.vintage;location.href="./vivino.html?q="+encodeURIComponent(q)}
function toast(t){let x=$( "toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),2200)}
render();
</script></body></html>
